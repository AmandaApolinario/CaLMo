services:
  db:
    image: postgres:15-alpine
    # platform: linux/arm64/v8 #If you are on MacOS you need to uncomment this line
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: python:3.9-slim-bullseye
    # platform: linux/arm64/v8 #If you are on MacOS you need to uncomment this line
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && python main.py"
    volumes:
      - ./:/app
    ports:
      - "5001:5001"
    depends_on:
      - db
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://app:postgres@db:5432/app
      - SQLALCHEMY_TRACK_MODIFICATIONS=False
      - JWT_SECRET_KEY=supersecretkey
      - DATABASE_URL=postgresql://app:postgres@db:5438/app

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9000:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_METRICS_PORT=9997 # Opcional
      - DYNAMIC_CONFIG_ENABLED=true # Permite configurar via interface se precisar

volumes:
  postgres_data:
    name: myapp-postgres-data